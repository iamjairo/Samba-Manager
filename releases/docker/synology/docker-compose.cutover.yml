services:
  samba-manager:
    extends:
      file: docker-compose.test.yml
      service: samba-manager

  samba-backend:
    image: ghcr.io/servercontainers/samba:smbd-only-latest
    container_name: samba-backend
    entrypoint: ["/bin/sh", "/bootstrap/servercontainers-entrypoint.sh"]
    command: ["runsvdir", "-P", "/container/config/runit"]
    environment:
      - ACCOUNT_${SAMBA_USERNAME}=${SAMBA_PASSWORD}
      - UID_${SAMBA_USERNAME}=${PUID}
      - SAMBA_CONF_WORKGROUP=WORKGROUP
      - SAMBA_CONF_SERVER_STRING=Synology Production Samba
      - >-
        SAMBA_GLOBAL_STANZA=include = /etc/samba/shares.conf;
        min protocol = SMB2_10;
        load printers = no;
        printing = bsd;
        disable spoolss = yes;
        ea support = yes;
        vfs objects = catia fruit streams_xattr;
        fruit:metadata = stream;
        fruit:model = MacSamba;
        fruit:veto_appledouble = no;
        fruit:delete_empty_adfiles = yes
      - AVAHI_NAME=${SAMBA_AVAHI_NAME:-samba-nas}
      - NETBIOS_DISABLE=1
      - WSDD2_DISABLE=1
      - TZ=${TZ:-UTC}
    volumes:
      - ${SAMBA_CONFIG_PATH:-./config}:/etc/samba
      - ./servercontainers-entrypoint.sh:/bootstrap/servercontainers-entrypoint.sh:ro
      - /etc/avahi/services:/external/avahi
      - ${SAMBA_SHARE_PATH}:/shares/data
      - samba-backend-state:/var/lib/samba
    restart: unless-stopped
    network_mode: host

volumes:
  samba-manager-logs:
  samba-manager-users:
  samba-backend-state:
